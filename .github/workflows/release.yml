name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build ARMv8 APK and publish Release
    runs-on: ubuntu-latest
    # 允许 GITHUB_TOKEN 创建 Release 并上传 APK
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/moneybox.keystore
            echo "使用 GitHub Secrets 提供的签名密钥"
          else
            echo "未配置 Secrets,使用仓库内置的便捷签名密钥"
          fi

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APKs
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.2.1-dev.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          ./gradlew :app:assembleRelease -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE" --stacktrace
          echo "APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Verify MuPDF JNI bindings in release APK
        run: python3 tools/check_mupdf_dex.py app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Collect APKs
        run: |
          mkdir -p dist
          VER="$APP_VERSION_NAME"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/MoneyToolbox-${VER}-arm64-v8a.apk"
          ls -la dist/

      - name: Upload branch test build
        if: github.ref_type == 'branch' && github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: arm64-test-${{ github.run_id }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: github.ref_type == 'tag' || github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}-{1}', github.run_number, github.run_attempt) }}
          name: 省钱工具箱 ${{ env.APP_VERSION_NAME }}
          prerelease: ${{ github.ref_type != 'tag' }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          body: |
            ## 📲 安装说明
            下载 **arm64-v8a** APK，适用于 ARMv8 手机。支持本地 PDF 阅读、文件管理器直接打开 PDF，以及单个或批量转 PNG。
            同一签名的旧版本可以覆盖安装，保留本地停车与续费数据。
            PDF 引擎使用 MuPDF（AGPL v3）；完整应用源码与许可文本见本仓库。
